# ===== Дублоны (экономика через Vault) =====
# Название валюты в сообщениях и меню
currency: "дублонов"
# Минимальная и максимальная ставка
min-bet: 100
max-bet: 1000000

# ===== Лей (PlayerPoints) =====
# Название донат-валюты в сообщениях и меню
points-currency: "Лей✞"
# Минимальная и максимальная ставка (PlayerPoints хранит только целые числа)
points-min-bet: 10
points-max-bet: 100000

# Комиссия сервера с выигрыша в процентах (0 = без комиссии), одна для обеих валют
# Пример: ставка 2000, комиссия 10% -> победитель получает 2000 + 1800 = 3800
commission-percent: 0

# Сколько открытых игр может создать один игрок одновременно
max-games-per-player: 3

# Оповещать весь сервер о новой игре
broadcast-new-game: true

# Префикс сообщений
prefix: "&6&lКНБ &8» &7"
